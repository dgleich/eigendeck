<!DOCTYPE html>
<!--eigendeck-demo-v1-->
<html>
<head>
<meta charset="utf-8">
<!-- This demo runs in an opaque-origin sandboxed iframe: no access to the app,
     Tauri, or window.parent, and no localStorage/sessionStorage/cookies. Theme
     values arrive as CSS vars — read them via var(--eigendeck-*, fallback).
     Fetching from the internet / a CDN is fine. -->
<style>
/* REQUIRED: html/body need explicit 100% size or the iframe collapses. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

/* MATCH THE DECK: don't set a background. The iframe is transparent, so the
   slide background shows through automatically on every theme. Only add a
   background if you must cover slide content or guarantee contrast.
   Fonts are injected (@font-face), so 'PT Sans' resolves; use var(--eigendeck-fg)
   for text so it stays readable on light AND dark slides. Other theme vars (for
   when you DO need color): --eigendeck-bg / -heading / -accent / -muted,
   --eigendeck-narrow / -mono, --eigendeck-base-size — and you can read/set them
   from JS for dynamic effects. */
body {
  /* no background → transparent → matches the slide */
  font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif;
  color: var(--eigendeck-fg, #222);
  overflow: hidden;
}

/* PREFIX every selector with a unique demo name to avoid clashes. */
.starter-main {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--eigendeck-fg, #222);
}
</style>
<!-- Load any CDN libraries here, before the script:
     <script src="https://d3js.org/d3.v7.min.js"></script> -->
<script>
(function () {
  // Standalone demo. For multi-piece demos (controller + viewports over
  // BroadcastChannel), see DEMO_AUTHORING.md.
  function setup() {
    const root = document.createElement('div');
    root.className = 'starter-main';

    // === Put your demo here ===
    root.textContent = 'Hello from your demo';
    // ==========================

    document.body.appendChild(root);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setup);
  } else {
    setup();
  }
})();
</script>
</head>
<body></body>
</html>
