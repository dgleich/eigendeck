[package]
name = "eigendeck"
version = "2026.5.29"
description = "A presentation tool with embedded HTML demos"
default-run = "eigendeck"
authors = ["David F. Gleich"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eigendeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "eigendeck-cli"
path = "src/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Download pdfium prebuilt dylib at build time (see build.rs).
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.21"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = { version = "2.4.5", features = ["watch"] }
tauri-plugin-single-instance = "2"
# PDF rendering via Google's pdfium (bundled dylib loaded at runtime).
# `thread_safe` wraps the C bindings in a Mutex so the OnceLock holding
# the Pdfium instance can be shared across Tauri command handlers.
pdfium-render = { version = "0.9", features = ["thread_safe"] }
# pdfium-render pulls in `image` with only the jpeg feature; we need
# png too for encoding the rendered bitmap into the asset_cache.
# Cargo unifies features so both crates see the merged set.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSWindow", "NSResponder", "NSApplication", "NSColor", "NSColorSpace"] }

# Native toolbar-color read: GTK theme color on Linux (version matches wry/tao).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Native toolbar-color read: GetSysColor on Windows (version matches wry/tao).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

