[package]
name = "eigendeck"
version = "26.7.15"
description = "A presentation tool with embedded HTML demos"
default-run = "eigendeck"
authors = ["David F. Gleich"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eigendeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "eigendeck-cli"
path = "src/cli.rs"

[features]
# Native macOS NSToolbar (src/mac_toolbar.rs). ON by default so a normal
# `tauri build` / `tauri dev` includes it; the code is also `cfg(target_os =
# "macos")`-gated, so enabling it on other platforms is inert. Build without it
# via `--no-default-features` if ever needed.
default = ["mac-toolbar"]
mac-toolbar = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Download pdfium prebuilt dylib at build time (see build.rs).
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"   # verify the pdfium download against a pinned SHA-256 (#147)

[dependencies]
tauri = { version = "2", features = ["devtools"] }
# Loopback HTTP shim that hosts the YouTube embed so the packaged app (origin
# tauri://localhost) can present YouTube. See src/youtube_shim.rs + docs/youtube-embed-shim.md.
tiny_http = "0.12"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.21"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = { version = "2.4.5", features = ["watch"] }
notify = "6"
tauri-plugin-single-instance = "2"
# PDF rendering via Google's pdfium (bundled dylib loaded at runtime).
# `thread_safe` wraps the C bindings in a Mutex so the OnceLock holding
# the Pdfium instance can be shared across Tauri command handlers.
pdfium-render = { version = "0.9", features = ["thread_safe"] }
# pdfium-render pulls in `image` with only the jpeg feature; we need
# png too for encoding the rendered bitmap into the asset_cache.
# Cargo unifies features so both crates see the merged set.
image = { version = "0.25", default-features = false, features = ["png"] }
# Cross-platform system-clipboard image write (copy an element to other apps).
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSGeometry", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSWindow", "NSResponder", "NSApplication", "NSPasteboard", "NSToolbar", "NSToolbarItem", "NSImage", "NSColor", "NSFont", "NSText", "NSTextField", "NSControl", "NSView", "NSGraphics", "NSLayoutAnchor", "NSLayoutConstraint", "NSCell", "NSTextFieldCell", "NSText", "NSEvent"] }

