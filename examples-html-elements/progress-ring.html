<!-- eigendeck-html-element name="Progress ring"
     A conic-gradient ring that sweeps up to its target on mount, via an animated
     @property angle (reliable across WebKit — unlike animating a CSS counter).
     Change the target in @keyframes + the centre label. Suggested box ~460×420. -->
<style>
  html,body{height:100%;margin:0}
  @property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
  .g{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif}
  .ring{--p:0%;width:240px;height:240px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(closest-side,#0b0e17 78%,transparent 79%),
      conic-gradient(#22d3ee var(--p),#1e293b 0);
    animation:fill 1.8s cubic-bezier(.2,.8,.2,1) forwards}
  .num{font-size:64px;font-weight:800;color:#e2e8f0}
  .cap{font-size:22px;color:#64748b;letter-spacing:.18em;text-transform:uppercase}
  @keyframes fill{to{--p:73%}}
</style>
<div class="g"><div class="ring"><span class="num">73%</span></div><div class="cap">coverage</div></div>
