<!DOCTYPE html>
<!--eigendeck-demo-v1-->
<html>
<head>
<meta charset="utf-8">
<!-- Unix "xeyes" as an eigendeck DEMO (runs JS in a sandboxed, offline iframe).
     The pupils follow the cursor anywhere inside this element's box, so size the
     element to whatever you want tracked (make it slide-sized for full-slide
     tracking). Live in present mode; double-click to interact in the editor.
     White eyeballs + dark ink read on both light and dark slides. -->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { overflow: hidden; background: transparent; }
.xeyes { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 4%; }
.xeye {
  position: relative; height: 82%; aspect-ratio: 3 / 4; max-height: 100%;
  background: #fdfdfb;
  border: 0.9vmin solid #23232b;
  border-radius: 50%;
  box-shadow: inset 0 -1.2vmin 2vmin rgba(0,0,0,0.12);
}
.xpupil {
  position: absolute; left: 50%; top: 50%;
  width: 34%; height: 26%;
  background: #17171c; border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: transform 60ms linear;
  will-change: transform;
}
</style>
</head>
<body>
<div class="xeyes">
  <div class="xeye"><div class="xpupil"></div></div>
  <div class="xeye"><div class="xpupil"></div></div>
</div>
<script>
(function () {
  const eyes = Array.prototype.slice.call(document.querySelectorAll('.xeye'));
  function gaze(clientX, clientY) {
    for (const eye of eyes) {
      const r = eye.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = clientX - cx, dy = clientY - cy;
      const ang = Math.atan2(dy, dx);
      // Pupil rides the rim toward the cursor; eases inward only when the cursor
      // is right on the eye. Keep it inside the sclera (leave a margin).
      const reach = Math.min(1, Math.hypot(dx, dy) / (r.width * 0.6));
      const maxX = r.width * 0.20, maxY = r.height * 0.22;
      const px = Math.cos(ang) * maxX * reach;
      const py = Math.sin(ang) * maxY * reach;
      eye.querySelector('.xpupil').style.transform =
        'translate(calc(-50% + ' + px + 'px), calc(-50% + ' + py + 'px))';
    }
  }
  window.addEventListener('pointermove', function (e) { gaze(e.clientX, e.clientY); });
  // Idle: glance up-ish so it looks alive even before the cursor arrives.
  window.addEventListener('pointerleave', function () { gaze(innerWidth / 2, -innerHeight); });
  gaze(innerWidth * 0.5, innerHeight * 0.35);
})();
</script>
</body>
</html>
