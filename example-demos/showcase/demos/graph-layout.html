<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph layout</title>
<!--
  Showcase demo — force-directed graph drawing with d3-force. DRAG any node and
  the whole layout re-settles around it (charge + links + centering + collision,
  d3's well-damped solver — far smoother than the hand-rolled version). The graph
  has three loosely-knit communities, so the layout reveals its structure as it
  relaxes. Title-LESS, theme-aware, transparent over the slide.

  Self-contained AFTER the build: `__D3FORCE__` (a 17 KB d3-dispatch+timer+
  quadtree+force bundle from vendor/) is injected by build-showcase.mjs. Opened
  raw it degrades to blank (the guard below) — like title-decor, it's assembled.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { overflow: hidden; position: relative; background: var(--eigendeck-bg, #ffffff);
    color: var(--eigendeck-fg, #222222); font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif;
    font-size: var(--eigendeck-base-size, 22px); }
  #gl { width: 100%; height: 100%; display: block; cursor: grab; }
  #gl.grabbing { cursor: grabbing; }
  .gl-hint { position: absolute; left: 50%; top: 7%; transform: translateX(-50%); font-size: 0.7em;
    color: var(--eigendeck-muted, #888); background: color-mix(in srgb, var(--eigendeck-bg, #fff) 70%, transparent);
    padding: 0.2em 0.7em; border-radius: 1em; pointer-events: none; transition: opacity 0.4s; user-select: none; }
  .gl-hint.gone { opacity: 0; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="gl-hint" id="gl-hint">drag a node</div>
<script>/* __D3FORCE__ */</script>
<script>
(function () {
  'use strict';
  if (typeof d3 === 'undefined' || !d3.forceSimulation) return;   // raw-open guard (d3 injected at build)
  function tv(n, fb) { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb; } catch (e) { return fb; } }
  var cv = document.getElementById('gl'), ctx = cv.getContext('2d'), hint = document.getElementById('gl-hint');

  // three communities; dense within, sparse across → visible structure
  var COMM = [10, 9, 9], COMM_COL = ['accent', '#f59e0b', '#10b981'];
  var nodes = [], links = [], comm = [];
  (function build() {
    var id = 0, c, k, base = 0;
    for (c = 0; c < COMM.length; c++) for (k = 0; k < COMM[c]; k++) { comm[id] = c; nodes.push({ id: id }); id++; }
    function add(a, b) { if (a !== b && !links.some(function (e) { return (e.s === a && e.t === b) || (e.s === b && e.t === a); })) links.push({ s: a, t: b, source: a, target: b }); }
    for (c = 0; c < COMM.length; c++) { for (k = 0; k < COMM[c]; k++) { var u = base + k; add(u, base + (k + 1) % COMM[c]); add(u, base + (k + 2) % COMM[c]); } base += COMM[c]; }
    add(2, 12); add(7, 20); add(15, 25); add(4, 23);   // cross-community bridges
  })();

  var W = 0, H = 0, dpr = 1, S = 1, sim = null, drag = null;
  function resize() {
    var r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr)); cv.width = W; cv.height = H; S = Math.min(W, H);
    if (sim) { sim.force('center', d3.forceCenter(W / 2, H / 2)); sim.force('link').distance(S * 0.1); sim.force('charge').strength(-S * 0.55); sim.alpha(0.4).restart(); }
  }
  function nodeR() { return Math.max(4, S * 0.014); }

  function draw() {
    var fg = tv('--eigendeck-fg', '#222'), bg = tv('--eigendeck-bg', '#fff'), acc = tv('--eigendeck-accent', '#2563eb');
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = fg; ctx.globalAlpha = 0.22; ctx.lineWidth = 1.4 * dpr;
    for (var e = 0; e < links.length; e++) { var L = links[e]; ctx.beginPath(); ctx.moveTo(L.source.x, L.source.y); ctx.lineTo(L.target.x, L.target.y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    var rad = nodeR();
    for (var i = 0; i < nodes.length; i++) {
      ctx.beginPath(); ctx.arc(nodes[i].x, nodes[i].y, rad, 0, 6.283);
      ctx.fillStyle = COMM_COL[comm[i]] === 'accent' ? acc : COMM_COL[comm[i]]; ctx.fill();
      ctx.lineWidth = 1.6 * dpr; ctx.strokeStyle = bg; ctx.stroke();
    }
  }

  sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(function (d) { return d.id; }).distance(80).strength(0.18))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(0, 0))
    .force('collide', d3.forceCollide().radius(function () { return nodeR() * 1.5; }))
    .velocityDecay(0.45)
    .on('tick', draw);

  function evtNode(e) { var r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * dpr, y = (e.clientY - r.top) * dpr, rad = nodeR() * 1.8;
    for (var i = nodes.length - 1; i >= 0; i--) if (Math.hypot(nodes[i].x - x, nodes[i].y - y) < rad) return [nodes[i], x, y]; return null; }
  cv.addEventListener('pointerdown', function (e) { var n = evtNode(e); if (!n) return; drag = n[0]; drag.fx = n[1]; drag.fy = n[2];
    sim.alphaTarget(0.3).restart(); cv.classList.add('grabbing'); cv.setPointerCapture(e.pointerId); hint.classList.add('gone'); });
  cv.addEventListener('pointermove', function (e) { if (!drag) return; var r = cv.getBoundingClientRect(); drag.fx = (e.clientX - r.left) * dpr; drag.fy = (e.clientY - r.top) * dpr; });
  function release() { if (!drag) return; drag.fx = null; drag.fy = null; drag = null; sim.alphaTarget(0); cv.classList.remove('grabbing'); }
  cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
  window.addEventListener('resize', function () { resize(); draw(); });

  // repaint on a live theme change (the sim stops ticking once settled)
  var lastTheme = '';
  setInterval(function () { var sig = tv('--eigendeck-fg', '') + '|' + tv('--eigendeck-bg', '') + '|' + tv('--eigendeck-accent', ''); if (sig !== lastTheme) { lastTheme = sig; draw(); } }, 400);

  resize();
})();
</script>
</body>
</html>
