<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polynomial interpolation</title>
<!--
  Showcase demo — the Runge phenomenon. Interpolate a function on [-1,1] by a
  degree-n polynomial through n+1 nodes, two ways, side by side: LEFT uniformly
  spaced nodes, RIGHT Chebyshev nodes. Drag the degree slider: the uniform
  interpolant blows up near the endpoints (error grows like 2^n) while the
  Chebyshev one converges — because Chebyshev nodes cluster at the ends (see the
  ticks). Barycentric Lagrange evaluation (numerically stable, so the wiggles you
  see are the real math, not round-off). Title-less, theme-aware, transparent.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { overflow: hidden; background: var(--eigendeck-bg, #ffffff); color: var(--eigendeck-fg, #222222);
    font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif; font-size: var(--eigendeck-base-size, 22px);
    display: flex; flex-direction: column; padding: 0.8em 1.2em; }
  .pi-row { flex: 1; min-height: 0; display: flex; gap: 1.6em; }
  .pi-panel { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
  .pi-lab { font-size: 0.66em; font-weight: 700; color: var(--eigendeck-heading, var(--eigendeck-fg, #222)); text-align: center; }
  .pi-panel canvas { flex: 1; min-height: 0; width: 100%; display: block; }
  .pi-err { text-align: center; font-size: 0.6em; color: var(--eigendeck-muted, #888); }
  .pi-err b { font-variant-numeric: tabular-nums; }
  .pi-ctrl { flex: 0 0 auto; display: flex; align-items: center; gap: 1.4em; margin-top: 0.5em; justify-content: center; flex-wrap: wrap; }
  .pi-row2 { display: flex; align-items: center; gap: 0.55em; font-size: 0.62em; color: var(--eigendeck-muted, #888); }
  .pi-row2 input[type=range] { width: 12em; accent-color: var(--eigendeck-accent, #2563eb);
    background: color-mix(in srgb, var(--eigendeck-fg, #333) 20%, transparent); border-radius: 4px; height: 0.35em; }
  .pi-deg { font-weight: 700; color: var(--eigendeck-fg, #222); font-variant-numeric: tabular-nums; }
  .pi-seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--eigendeck-fg, #333) 26%, transparent); border-radius: 6px; overflow: hidden; }
  .pi-seg button { font-family: inherit; font-size: 1em; cursor: pointer; border: 0; background: transparent; color: var(--eigendeck-fg, #222); padding: 0.25em 0.7em; }
  .pi-seg button.on { background: var(--eigendeck-accent, #2563eb); color: #fff; }
</style>
</head>
<body>
  <div class="pi-row">
    <div class="pi-panel"><div class="pi-lab">uniform nodes</div><canvas id="cv-u"></canvas><div class="pi-err" id="err-u">—</div></div>
    <div class="pi-panel"><div class="pi-lab">Chebyshev nodes</div><canvas id="cv-c"></canvas><div class="pi-err" id="err-c">—</div></div>
  </div>
  <div class="pi-ctrl">
    <div class="pi-row2"><span>degree</span><input id="pi-deg" type="range" min="4" max="24" step="1" value="12"><span class="pi-deg" id="pi-degv">12</span></div>
    <div class="pi-row2"><span>function</span>
      <span class="pi-seg" id="pi-fn">
        <button data-f="runge" class="on">Runge</button><button data-f="steep">steep</button><button data-f="abs">|x|</button>
      </span>
    </div>
  </div>
<script>
(function () {
  'use strict';
  function tv(n, fb) { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb; } catch (e) { return fb; } }
  var FNS = { runge: function (x) { return 1 / (1 + 25 * x * x); }, steep: function (x) { return 1 / (1 + 80 * x * x); }, abs: function (x) { return Math.abs(x); } };
  var fn = FNS.runge, deg = 12;
  var YMIN = -1.0, YMAX = 2.0;

  function uniform(n) { var a = []; for (var i = 0; i <= n; i++) a.push(-1 + 2 * i / n); return a; }
  function cheb(n) { var a = []; for (var i = 0; i <= n; i++) a.push(Math.cos(Math.PI * i / n)); return a; }
  function baryW(xs) { var n = xs.length, w = new Array(n).fill(1), j, k; for (j = 0; j < n; j++) for (k = 0; k < n; k++) if (k !== j) w[j] /= (xs[j] - xs[k]); return w; }
  function baryEval(xs, fs, w, x) { var num = 0, den = 0; for (var j = 0; j < xs.length; j++) { var d = x - xs[j]; if (d === 0) return fs[j]; var t = w[j] / d; num += t * fs[j]; den += t; } return num / den; }

  var cU = document.getElementById('cv-u'), xU = cU.getContext('2d');
  var cC = document.getElementById('cv-c'), xC = cC.getContext('2d');
  var degEl = document.getElementById('pi-deg'), degV = document.getElementById('pi-degv');
  var errU = document.getElementById('err-u'), errC = document.getElementById('err-c');
  var dpr = 1;
  function size(c) { var r = c.getBoundingClientRect(); dpr = window.devicePixelRatio || 1; var w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } return [w, h]; }

  function drawPanel(ctx, canvas, nodes, errEl) {
    var d = size(canvas), W = d[0], H = d[1], padX = W * 0.04, padY = H * 0.06;
    var fg = tv('--eigendeck-fg', '#222'), acc = tv('--eigendeck-accent', '#2563eb'), mut = tv('--eigendeck-muted', '#aaa');
    ctx.clearRect(0, 0, W, H);
    function X(x) { return padX + (x + 1) / 2 * (W - 2 * padX); }
    function Y(y) { return padY + (YMAX - y) / (YMAX - YMIN) * (H - 2 * padY); }
    // axes
    ctx.strokeStyle = fg; ctx.globalAlpha = 0.16; ctx.lineWidth = dpr;
    ctx.beginPath(); ctx.moveTo(X(-1), Y(0)); ctx.lineTo(X(1), Y(0)); ctx.stroke();           // y=0
    ctx.beginPath(); ctx.rect(X(-1), padY, X(1) - X(-1), H - 2 * padY); ctx.stroke(); ctx.globalAlpha = 1;  // frame (clips the curve)
    ctx.save(); ctx.beginPath(); ctx.rect(X(-1), padY, X(1) - X(-1), H - 2 * padY); ctx.clip();
    // true function (faint)
    ctx.strokeStyle = mut; ctx.globalAlpha = 0.7; ctx.lineWidth = 2 * dpr; ctx.beginPath();
    for (var i = 0; i <= 400; i++) { var x = -1 + 2 * i / 400, y = fn(x); i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)); } ctx.stroke(); ctx.globalAlpha = 1;
    // interpolant (accent) — clipped to frame, so blow-ups shoot off the edge
    var fs = nodes.map(fn), w = baryW(nodes), maxe = 0;
    ctx.strokeStyle = acc; ctx.lineWidth = 2.8 * dpr; ctx.lineJoin = 'round'; ctx.beginPath();
    for (i = 0; i <= 600; i++) { x = -1 + 2 * i / 600; var p = baryEval(nodes, fs, w, x); i ? ctx.lineTo(X(x), Y(p)) : ctx.moveTo(X(x), Y(p)); var e = Math.abs(p - fn(x)); if (e > maxe) maxe = e; }
    ctx.stroke(); ctx.restore();
    // nodes (dots on the true curve) + ticks on the axis (show the spacing)
    for (var j = 0; j < nodes.length; j++) {
      ctx.beginPath(); ctx.arc(X(nodes[j]), Y(fn(nodes[j])), 3.4 * dpr, 0, 6.283); ctx.fillStyle = acc; ctx.fill();
      ctx.strokeStyle = fg; ctx.globalAlpha = 0.45; ctx.lineWidth = dpr; ctx.beginPath(); ctx.moveTo(X(nodes[j]), H - padY); ctx.lineTo(X(nodes[j]), H - padY - 7 * dpr); ctx.stroke(); ctx.globalAlpha = 1;
    }
    errEl.innerHTML = 'max error <b style="color:' + (maxe > 0.5 ? '#e0483b' : acc) + '">' + (maxe >= 100 ? maxe.toFixed(0) : maxe.toPrecision(2)) + '</b>';
  }
  function draw() { degV.textContent = deg; drawPanel(xU, cU, uniform(deg), errU); drawPanel(xC, cC, cheb(deg), errC); }

  degEl.addEventListener('input', function () { deg = parseInt(degEl.value, 10); draw(); });
  document.getElementById('pi-fn').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fn = FNS[b.dataset.f]; Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); }); draw(); });
  window.addEventListener('resize', draw);
  var last = ''; setInterval(function () { var s = tv('--eigendeck-fg', '') + tv('--eigendeck-accent', ''); if (s !== last) { last = s; draw(); } }, 500);

  function start() { draw(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
