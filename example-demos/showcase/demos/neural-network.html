<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neural network — MNIST through a small ResNet</title>
<!--
  Showcase demo — a small ResNet classifying MNIST digits, with the data flow
  visualized. Title-LESS, theme-aware, interaction-first: DRAW a digit in the box
  (or hit "example") and watch it flow left→right through the layers — conv → a
  residual block (note the skip arc) → strided conv → global average pool → a
  10-way softmax. The weights are REAL (a tiny ResNet, ~10k params, trained on
  MNIST to ~98% and embedded); inference runs live in JS on every stroke.
  Transparent over the slide; colors track the deck theme.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    overflow: hidden; position: relative;
    background: var(--eigendeck-bg, #ffffff);
    color: var(--eigendeck-fg, #222222);
    font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif;
    font-size: var(--eigendeck-base-size, 22px);
  }
  #nn { width: 100%; height: 100%; display: block; }
  .nn-ctrl { position: absolute; left: 1.1em; bottom: 0.9em; display: flex; gap: 0.7em; font-size: 1em; }
  .nn-btn { font-family: inherit; font-size: 1em; cursor: pointer; border: 1px solid color-mix(in srgb, var(--eigendeck-fg,#333) 32%, transparent);
    background: color-mix(in srgb, var(--eigendeck-fg,#333) 5%, transparent); color: var(--eigendeck-fg, #222); border-radius: 7px; padding: 0.45em 1.2em; }
  .nn-btn:hover { background: color-mix(in srgb, var(--eigendeck-accent,#2563eb) 16%, transparent); }
  .nn-hint { position: absolute; left: 1.1em; top: 0.8em; font-size: 0.66em; color: var(--eigendeck-muted, #888); pointer-events: none; user-select: none; transition: opacity 0.4s; }
  .nn-hint.gone { opacity: 0; }
</style>
</head>

    for (var yd = 0; yd < 28; yd++) for (var xd = 0; xd < 28; xd++) { var sx = xd - shx, sy = yd - shy; if (sx >= 0 && sx < 28 && sy >= 0 && sy < 28) input28[yd * 28 + xd] = tmp[sy * 28 + sx]; }
  }
  function run() { if (!isSample) downAndCenter(); result = forward(input28); draw(); }

  // ---- rendering ----
  var W = 0, H = 0, dpr = 1, inputRect = null;
  function resize() { var r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1; W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr)); cv.width = W; cv.height = H; }

  function heat(x, y, w, h, m, ch, acc) {                  // draw one feature-map channel ch
    var H1 = m.H, W1 = m.W, b = ch * H1 * W1, mn = 1e9, mxv = -1e9;
    for (var i = 0; i < H1 * W1; i++) { var v = m.d[b + i]; if (v < mn) mn = v; if (v > mxv) mxv = v; }
    var rng = Math.max(1e-4, mxv - mn), cw = w / W1, chh = h / H1;
    for (var yy = 0; yy < H1; yy++) for (var xx = 0; xx < W1; xx++) { var t = (m.d[b + yy * W1 + xx] - mn) / rng;
      ctx.fillStyle = 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',' + (t * 0.95).toFixed(3) + ')';
      ctx.fillRect(x + xx * cw, y + yy * chh, cw + 0.6, chh + 0.6); }
  }
  function grid(cx, cy, gw, gh, m, cols, acc, fg) {        // grid of small maps
    var rows = Math.ceil(m.C / cols), pad = gw * 0.06, cellW = (gw - pad * (cols - 1)) / cols, cellH = (gh - pad * (rows - 1)) / rows;
    var side = Math.min(cellW, cellH);
    for (var c = 0; c < m.C; c++) { var col = c % cols, row = (c / cols) | 0, x = cx + col * (cellW + pad), y = cy + row * (cellH + pad);
      ctx.fillStyle = 'rgba(' + acc[0] + ',' + acc[1] + ',' + acc[2] + ',0.06)'; ctx.fillRect(x, y, side, side);
      heat(x, y, side, side, m, c, acc); }
    return { rows: rows };
  }
  function label(x, y, t, fg, sz) { ctx.fillStyle = fg; ctx.globalAlpha = 0.65; ctx.font = sz + 'px ' + tv('--eigendeck-font', 'PT Sans') + ', sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t, x, y); ctx.globalAlpha = 1; }
  function arrow(x1, y, x2, fg) { ctx.strokeStyle = fg; ctx.globalAlpha = 0.4; ctx.lineWidth = 2 * dpr; ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(x2 - 6 * dpr, y - 4 * dpr); ctx.lineTo(x2 - 6 * dpr, y + 4 * dpr); ctx.closePath(); ctx.fillStyle = fg; ctx.fill(); ctx.globalAlpha = 1; }

  function draw() {
    var fg = tv('--eigendeck-fg', '#222'), acc = hexToRgb(tv('--eigendeck-accent', '#2563eb'));
    ctx.clearRect(0, 0, W, H);
    var midY = H * 0.46, sz = Math.max(10, H * 0.026), lblY = H * 0.86;
    // columns
    var pad = W * 0.02, x = pad;
    var inSide = Math.min(H * 0.42, W * 0.17);
    inputRect = { x: x, y: midY - inSide / 2, s: inSide };
    // input digit
    var im = ctx.createImageData(28, 28); for (var i = 0; i < 784; i++) { var v = input28[i] | 0; var fgr = hexToRgb(fg); im.data[i * 4] = fgr[0]; im.data[i * 4 + 1] = fgr[1]; im.data[i * 4 + 2] = fgr[2]; im.data[i * 4 + 3] = v; }
    var oc = document.createElement('canvas'); oc.width = 28; oc.height = 28; oc.getContext('2d').putImageData(im, 0, 0);
    ctx.strokeStyle = fg; ctx.globalAlpha = 0.3; ctx.lineWidth = 1.5 * dpr; ctx.strokeRect(inputRect.x, inputRect.y, inSide, inSide); ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = false; ctx.drawImage(oc, inputRect.x, inputRect.y, inSide, inSide); ctx.imageSmoothingEnabled = true;
    label(inputRect.x + inSide / 2, lblY, 'input 28×28', fg, sz);
    x += inSide + W * 0.035;

    if (!result) return;
    var stages = result.stages, stageW = W * 0.13, stageH = H * 0.6, sy = midY - stageH / 2;
    var names = ['conv + pool', 'residual block', 'conv ↓2'], cols = [4, 4, 8];
    var resColX = [];
    for (var s2 = 0; s2 < 3; s2++) {
      arrow(x - W * 0.028, midY, x - 4 * dpr, fg);
      grid(x, sy, stageW, stageH, stages[s2], cols[s2], acc, fg);
      label(x + stageW / 2, lblY, names[s2] + '  ' + stages[s2].C + '×' + stages[s2].H + '×' + stages[s2].W, fg, sz);
      resColX.push({ x: x, w: stageW });
      x += stageW + W * 0.035;
    }
    // residual skip arc over stage B (from input-of-block to output)
    var a0 = resColX[0], a1 = resColX[1], topY = sy - H * 0.04;
    ctx.strokeStyle = acc.join ? 'rgb(' + acc.join(',') + ')' : '#2563eb'; ctx.globalAlpha = 0.7; ctx.lineWidth = 2 * dpr;
    ctx.beginPath(); ctx.moveTo(a0.x + a0.w, sy + stageH * 0.5); ctx.bezierCurveTo(a0.x + a0.w + W * 0.02, topY, a1.x - W * 0.005, topY, a1.x + a1.w * 0.5, sy - 2 * dpr); ctx.stroke();
    label((a0.x + a1.x) / 2, topY - 6 * dpr, 'skip +', 'rgb(' + acc.join(',') + ')', sz * 0.9); ctx.globalAlpha = 1;

    // prediction bars
    arrow(x - W * 0.028, midY, x - 4 * dpr, fg);
    var pw = W - x - pad, probs = result.probs, best = probs.indexOf(Math.max.apply(null, probs));
    var bh = stageH / 10 * 0.7, gap = stageH / 10 * 0.3, by = sy, barX = x + pw * 0.18, barMax = pw * 0.62;
    for (var d = 0; d < 10; d++) {
      var yy = by + d * (bh + gap);
      ctx.fillStyle = fg; ctx.globalAlpha = d === best ? 1 : 0.5; ctx.textAlign = 'right'; ctx.font = '700 ' + (bh * 0.9) + 'px ' + tv('--eigendeck-font', 'PT Sans') + ',sans-serif'; ctx.textBaseline = 'middle';
      ctx.fillText(d, barX - 8 * dpr, yy + bh / 2);
      ctx.fillStyle = d === best ? 'rgb(' + acc.join(',') + ')' : fg; ctx.globalAlpha = d === best ? 1 : 0.25;
      ctx.fillRect(barX, yy, Math.max(1, probs[d] * barMax), bh); ctx.globalAlpha = 1;
    }
    label(x + pw / 2, lblY, 'softmax → ' + best, fg, sz);
    ctx.textBaseline = 'alphabetic';
  }

  // ---- drawing into the input ----
  var drawing = false;
  function paint(px, py) {
    if (!inputRect) return; var lx = (px * dpr - inputRect.x) / inputRect.s, ly = (py * dpr - inputRect.y) / inputRect.s;
    if (lx < 0 || lx > 1 || ly < 0 || ly > 1) return;
    isSample = false; hint.classList.add('gone');
    var bx = lx * DRW, by = ly * DRW, R = DRW * 0.07;
    for (var y = Math.max(0, (by - R) | 0); y < Math.min(DRW, by + R); y++) for (var x = Math.max(0, (bx - R) | 0); x < Math.min(DRW, bx + R); x++) {
      var dd = Math.hypot(x - bx, y - by); if (dd < R) drawBuf[y * DRW + x] = Math.min(255, drawBuf[y * DRW + x] + 255 * (1 - dd / R) * 0.6); }
    run();
  }
  cv.addEventListener('pointerdown', function (e) { drawing = true; cv.setPointerCapture(e.pointerId); var r = cv.getBoundingClientRect(); paint(e.clientX - r.left, e.clientY - r.top); });
  cv.addEventListener('pointermove', function (e) { if (!drawing) return; var r = cv.getBoundingClientRect(); paint(e.clientX - r.left, e.clientY - r.top); });
  cv.addEventListener('pointerup', function () { drawing = false; });
  document.getElementById('nn-clr').addEventListener('click', function () { drawBuf.fill(0); input28.fill(0); isSample = false; result = forward(input28); draw(); hint.classList.remove('gone'); });
  var si = 0;
  document.getElementById('nn-ex').addEventListener('click', function () { var s = SAMPLES[si % SAMPLES.length]; si++; drawBuf.fill(0); for (var i = 0; i < 784; i++) input28[i] = s.px[i]; isSample = true; hint.classList.add('gone'); result = forward(input28); draw(); });
  window.addEventListener('resize', function () { resize(); draw(); });
  var lastTheme = '';
  setInterval(function () { var sig = tv('--eigendeck-fg', '') + '|' + tv('--eigendeck-bg', '') + '|' + tv('--eigendeck-accent', ''); if (sig !== lastTheme) { lastTheme = sig; draw(); } }, 400);

  function start() { resize(); document.getElementById('nn-ex').click(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
