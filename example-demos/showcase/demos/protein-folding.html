<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Protein folding</title>
<!--
  Showcase demo — hydrophobic collapse (the HP model, off-lattice). A chain of
  residues, each Hydrophobic (warm) or Polar (cool), folds under three forces:
  stiff backbone bonds, excluded volume (no overlaps), and an attraction between
  hydrophobic residues that buries them in a core. Simulated annealing cools the
  chain so it settles into a compact globule. DRAG a residue to tug the chain;
  "new sequence" reshuffles + refolds. Title-LESS, theme-aware, transparent.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { overflow: hidden; position: relative; background: var(--eigendeck-bg, #ffffff); color: var(--eigendeck-fg, #222222);
    font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif; font-size: var(--eigendeck-base-size, 22px); }
  #pf { width: 100%; height: 100%; display: block; cursor: grab; }
  #pf.grab { cursor: grabbing; }
  .pf-ui { position: absolute; left: 1.1em; bottom: 0.9em; display: flex; align-items: center; gap: 1.1em; font-size: 0.62em; color: var(--eigendeck-muted, #888); }
  .pf-key { display: flex; align-items: center; gap: 1em; }
  .pf-key span { display: inline-flex; align-items: center; gap: 0.4em; }
  .pf-dot { width: 0.85em; height: 0.85em; border-radius: 50%; display: inline-block; }
  .pf-btn { font-family: inherit; font-size: 1em; cursor: pointer; border: 1px solid color-mix(in srgb, var(--eigendeck-fg,#333) 32%, transparent);
    background: color-mix(in srgb, var(--eigendeck-fg,#333) 5%, transparent); color: var(--eigendeck-fg, #222); border-radius: 7px; padding: 0.4em 1em; }
  .pf-btn:hover { background: color-mix(in srgb, var(--eigendeck-accent,#2563eb) 16%, transparent); }
  .pf-stat { position: absolute; right: 1.2em; bottom: 1em; font-size: 0.62em; color: var(--eigendeck-muted, #888); }
  .pf-stat b { color: var(--eigendeck-accent, #2563eb); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <canvas id="pf"></canvas>
  <div class="pf-ui">
    <button class="pf-btn" id="pf-new">new sequence</button>
    <div class="pf-key"><span><i class="pf-dot" id="pf-kh"></i>hydrophobic</span><span><i class="pf-dot" id="pf-kp"></i>polar</span></div>
  </div>
  <div class="pf-stat">H–H contacts <b id="pf-c">0</b></div>
<script>
(function () {
  'use strict';
  function tv(n, fb) { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb; } catch (e) { return fb; } }
  var cv = document.getElementById('pf'), ctx = cv.getContext('2d');
  var H_COL = '#e0664a', P_COL = '#3b82f6';
  document.getElementById('pf-kh').style.background = H_COL;
  document.getElementById('pf-kp').style.background = P_COL;
  var cEl = document.getElementById('pf-c');

  var N = 32, res = [], seqH = [];           // res[i] = {x,y,vx,vy}; seqH[i]=true if hydrophobic
  var W = 0, H = 0, dpr = 1, S = 1, L = 1, temp = 0, drag = null;
  function unit() { return S; }
  function resize() { var r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1; W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr)); cv.width = W; cv.height = H; S = Math.min(W, H); L = 0.05 * S; }

  function reseed() {
    seqH = []; for (var i = 0; i < N; i++) seqH.push(Math.random() < 0.5);
    // lay out as a gentle random walk near center so it starts unfolded
    res = []; var x = W / 2 - N * L * 0.35, y = H / 2, ang = 0;
    for (i = 0; i < N; i++) { res.push({ x: x, y: y, vx: 0, vy: 0 }); ang += (Math.random() - 0.5) * 1.2; x += Math.cos(ang) * L; y += Math.sin(ang) * L; }
    temp = 0.9;                              // start hot, anneal down
  }

  function step(dt) {
    var n = res.length, i, j;
    var fx = new Float64Array(n), fy = new Float64Array(n);
    var rc = 2.7 * L, excl = 1.0 * L;
    for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) {
      var dx = res[j].x - res[i].x, dy = res[j].y - res[i].y, d = Math.hypot(dx, dy) || 0.01, ux = dx / d, uy = dy / d;
      if (j === i + 1) continue;             // bonded pair handled below
      // excluded volume (all non-bonded pairs)
      if (d < excl) { var f = (excl - d) * 2.5; fx[i] -= ux * f; fy[i] -= uy * f; fx[j] += ux * f; fy[j] += uy * f; }
      // hydrophobic attraction (H–H within cutoff)
      else if (seqH[i] && seqH[j] && d < rc) { var fa = 0.11 * L; fx[i] += ux * fa; fy[i] += uy * fa; fx[j] -= ux * fa; fy[j] -= uy * fa; }
    }
    // backbone springs (stiff) keep adjacent residues at L
    for (i = 0; i < n - 1; i++) {
      var dx2 = res[i + 1].x - res[i].x, dy2 = res[i + 1].y - res[i].y, d2 = Math.hypot(dx2, dy2) || 0.01, k = (d2 - L) * 0.5, ux2 = dx2 / d2, uy2 = dy2 / d2;
      fx[i] += ux2 * k; fy[i] += uy2 * k; fx[i + 1] -= ux2 * k; fy[i + 1] -= uy2 * k;
    }
    var cx = W / 2, cy = H / 2;
    for (i = 0; i < n; i++) {
      if (drag === i) continue;
      fx[i] += (cx - res[i].x) * 0.0012; fy[i] += (cy - res[i].y) * 0.0012;   // gentle centering
      if (temp > 0) { fx[i] += (Math.random() - 0.5) * temp * L * 0.5; fy[i] += (Math.random() - 0.5) * temp * L * 0.5; } // thermal (anneals to 0)
      res[i].vx = (res[i].vx + fx[i]) * 0.8; res[i].vy = (res[i].vy + fy[i]) * 0.8;
      var lim = L * 0.6, sp = Math.hypot(res[i].vx, res[i].vy); if (sp > lim) { res[i].vx *= lim / sp; res[i].vy *= lim / sp; }
      res[i].x += res[i].vx; res[i].y += res[i].vy;
      res[i].x = Math.max(L, Math.min(W - L, res[i].x)); res[i].y = Math.max(L, Math.min(H - L, res[i].y));
    }
    temp = temp > 0.004 ? temp * 0.99 : 0;     // anneal fully to 0 so it SETTLES into a folded minimum
  }

  function contacts() { var n = res.length, c = 0, rc = 2.7 * L, i, j; for (i = 0; i < n; i++) for (j = i + 2; j < n; j++) if (seqH[i] && seqH[j] && Math.hypot(res[j].x - res[i].x, res[j].y - res[i].y) < rc) c++; return c; }

  function draw() {
    var fg = tv('--eigendeck-fg', '#222'), bg = tv('--eigendeck-bg', '#fff');
    ctx.clearRect(0, 0, W, H);
    // backbone
    ctx.strokeStyle = fg; ctx.globalAlpha = 0.35; ctx.lineWidth = Math.max(2, L * 0.22); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); for (var i = 0; i < res.length; i++) { i ? ctx.lineTo(res[i].x, res[i].y) : ctx.moveTo(res[i].x, res[i].y); } ctx.stroke(); ctx.globalAlpha = 1;
    // residues
    var rad = L * 0.46;
    for (i = 0; i < res.length; i++) {
      var col = seqH[i] ? H_COL : P_COL, x = res[i].x, y = res[i].y;
      var g = ctx.createRadialGradient(x - rad * 0.35, y - rad * 0.35, rad * 0.1, x, y, rad);
      g.addColorStop(0, lighten(col, 0.5)); g.addColorStop(1, col);
      ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.283); ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = Math.max(1, L * 0.04); ctx.strokeStyle = bg; ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
    }
    cEl.textContent = contacts();
  }
  function lighten(hex, t) { var n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; return 'rgb(' + Math.round(r + (255 - r) * t) + ',' + Math.round(g + (255 - g) * t) + ',' + Math.round(b + (255 - b) * t) + ')'; }

  function frame() { step(1); draw(); requestAnimationFrame(frame); }

  function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; }
  function nearest(x, y) { var best = -1, bd = L * 1.2; for (var i = 0; i < res.length; i++) { var d = Math.hypot(res[i].x - x, res[i].y - y); if (d < bd) { bd = d; best = i; } } return best; }
  cv.addEventListener('pointerdown', function (e) { var p = pos(e), i = nearest(p[0], p[1]); if (i < 0) return; drag = i; cv.classList.add('grab'); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) { if (drag == null) return; var p = pos(e); res[drag].x = p[0]; res[drag].y = p[1]; res[drag].vx = res[drag].vy = 0; });
  function up() { drag = null; cv.classList.remove('grab'); }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  document.getElementById('pf-new').addEventListener('click', reseed);
  window.addEventListener('resize', function () { resize(); });

  function start() { resize(); reseed(); requestAnimationFrame(frame); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
