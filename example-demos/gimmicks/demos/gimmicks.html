<!DOCTYPE html>
<!--eigendeck-demo-v1-->
<html>
<head>
<meta charset="utf-8">
<!--
  gimmicks.html — a one-word "drop-in" reveal for Eigendeck.

  Shows a single word in the DECK'S font and colour over a TRANSPARENT
  background (so it matches any slide theme automatically). Click anywhere and
  the letters fall in from above and fade in, staggered. Click again to replay.

  CONFIGURE THE WORD (first match wins):
    1. URL hash param when testing standalone:  gimmicks.html#word=tricks
    2. The demo-piece's `piece` name (set in the deck JSON):  "piece": "tricks"
    3. The DEFAULT_WORD constant just below — edit this one line.
  Spaces are allowed (e.g. word=spectral%20methods).
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  /* No background → the slide shows straight through (matches every theme). */
  body {
    overflow: hidden;
    font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif;
    /* Track the deck's heading colour, fall back to body text, then a dark grey. */
    color: var(--eigendeck-heading, var(--eigendeck-fg, #1a1a2e));
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .gk-stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .gk-word {
    display: flex; flex-wrap: nowrap; align-items: baseline;
    font-weight: 700; line-height: 1; white-space: nowrap;
  }
  .gk-letter {
    display: inline-block;
    opacity: 0;                 /* hidden until played */
    will-change: transform, opacity;
  }
  .gk-space { display: inline-block; }   /* width set in JS, per font size */
  /* Author hint — only until the first click. */
  .gk-hint {
    position: absolute; left: 50%; bottom: 6%;
    transform: translateX(-50%);
    font-size: 14px; font-weight: 400; opacity: .45;
    font-family: var(--eigendeck-font, 'PT Sans'), system-ui, sans-serif;
    transition: opacity .3s ease;
    pointer-events: none;
  }
  .gk-hint.gk-gone { opacity: 0; }
</style>
</head>
<body>
<div class="gk-stage"><div class="gk-word" id="gk-word" aria-label=""></div></div>
<div class="gk-hint" id="gk-hint">click to reveal</div>
<script>
(function () {
  // ----- 1. resolve the word ------------------------------------------------
  var DEFAULT_WORD = 'gimmicks';
  var params = new URLSearchParams(location.hash.slice(1));
  var word = (params.get('word') || params.get('piece') || DEFAULT_WORD).toString();

  var stageWord = document.getElementById('gk-word');
  var hint = document.getElementById('gk-hint');
  stageWord.setAttribute('aria-label', word);

  // ----- 2. build one span per letter (spaces become a sized gap) -----------
  var letters = [];
  for (var i = 0; i < word.length; i++) {
    var ch = word[i];
    if (ch === ' ') {
      var sp = document.createElement('span');
      sp.className = 'gk-space';
      stageWord.appendChild(sp);
      continue;
    }
    var span = document.createElement('span');
    span.className = 'gk-letter';
    span.textContent = ch;
    stageWord.appendChild(span);
    letters.push(span);
  }

  // ----- 3. size the word to fit the iframe (transparent, full-bleed) --------
  function fit() {
    var W = document.documentElement.clientWidth;
    var H = document.documentElement.clientHeight;
    // Approx: average glyph advance ~0.62em; keep a 12% side/top margin.
    var byW = (W * 0.88) / Math.max(1, word.length * 0.62);
    var byH = H * 0.7;
    var size = Math.max(12, Math.min(byW, byH));
    stageWord.style.fontSize = size + 'px';
    // Space width ~0.32em of the current size.
    var spaces = stageWord.querySelectorAll('.gk-space');
    for (var k = 0; k < spaces.length; k++) spaces[k].style.width = (size * 0.32) + 'px';
  }

  // ----- 4. the reveal: each letter falls in + fades in, staggered ----------
  var STAGGER = Math.max(45, Math.min(110, 700 / Math.max(1, letters.length)));
  function play() {
    var drop = (parseFloat(stageWord.style.fontSize) || 80) * 0.85;
    letters.forEach(function (el, idx) {
      el.animate(
        [
          { transform: 'translateY(' + (-drop) + 'px)', opacity: 0 },
          { transform: 'translateY(0)', opacity: 1 }
        ],
        { duration: 560, delay: idx * STAGGER,
          easing: 'cubic-bezier(.18, 1.25, .4, 1)', fill: 'both' }
      );
    });
  }

  // ----- 5. wire up ---------------------------------------------------------
  function onClick() {
    hint.classList.add('gk-gone');
    play();
  }
  window.addEventListener('click', onClick);
  window.addEventListener('resize', fit);

  function start() { fit(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
