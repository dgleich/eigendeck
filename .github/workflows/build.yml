name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Per-arch macOS builds (NOT universal): the universal target only
          # lipo's the MAIN binary, not the second `eigendeck-cli`, so its
          # bundle fails. Per-arch builds the .app (incl. eigendeck-cli) fine;
          # the only issue is the x86_64 DMG step flaking on hdiutil — handled
          # by the retry chain below.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            label: 'macOS-ARM64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            label: 'macOS-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            label: 'Linux-x64'
          - platform: 'windows-latest'
            args: ''
            label: 'Windows-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup MathJax bundle
        run: npm run setup

      # Import the Developer ID cert into the keychain BEFORE the build, so the
      # identity is available to the beforeBundleCommand pdfium-signing hook (which
      # runs during the build, before tauri-action would otherwise import the cert).
      # tauri's own app signing then reuses this same keychain (so APPLE_CERTIFICATE
      # is NOT passed to tauri-action — one keychain, no ambiguity).
      - name: Import signing certificate (macOS)
        if: matrix.platform == 'macos-latest'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # tauri-action builds + bundles + uploads to ONE draft release per tag
      # (idempotent: it reuses an existing draft and uploads missing assets).
      # macOS DMG packaging (bundle_dmg.sh / hdiutil) flakes intermittently, so
      # we retry the whole step up to 3x — a re-run recompiles from the warm
      # cargo cache and re-bundles, giving hdiutil another attempt. The first
      # two attempts swallow failure (continue-on-error); the third is the
      # gate, so the job only fails if all three fail.
      - name: Build Tauri app (attempt 1)
        id: build1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (empty on Linux/Windows → ignored). The cert
          # is imported into the keychain by the "Import signing certificate" step
          # ABOVE — before the build — so BOTH the beforeBundleCommand pdfium-signing
          # hook AND tauri's own app signing find the identity. (tauri-action's built-in
          # cert import happens too late for the hook, hence the up-front import.)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Eigendeck ${{ github.ref_name }}'
          releaseBody: 'See the assets for download links.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri app (attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (empty on Linux/Windows → ignored). The cert
          # is imported into the keychain by the "Import signing certificate" step
          # ABOVE — before the build — so BOTH the beforeBundleCommand pdfium-signing
          # hook AND tauri's own app signing find the identity. (tauri-action's built-in
          # cert import happens too late for the hook, hence the up-front import.)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Eigendeck ${{ github.ref_name }}'
          releaseBody: 'See the assets for download links.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Tauri app (attempt 3)
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (empty on Linux/Windows → ignored). The cert
          # is imported into the keychain by the "Import signing certificate" step
          # ABOVE — before the build — so BOTH the beforeBundleCommand pdfium-signing
          # hook AND tauri's own app signing find the identity. (tauri-action's built-in
          # cert import happens too late for the hook, hence the up-front import.)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Eigendeck ${{ github.ref_name }}'
          releaseBody: 'See the assets for download links.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
